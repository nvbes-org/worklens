[workspace]
members = [
    "crates/core",
    "crates/runtime",
    "crates/cli",
    "apps/desktop/src-tauri",
    "crates/aurora-core",
    "crates/aurora-blocks",
    "crates/aurora-mux",
    "crates/aurora-tools",
    "crates/aurora-canvas",
    "crates/aurora-render",
    "crates/aurora-bridge",
    "apps/aurora-term",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nvbes-org/worklens"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
tempfile = "3"
notify = "8"
sysinfo = "0.33"

[profile.release]
lto = "thin"
strip = true
